[project]
name = "privguard-gateway"
version = "0.1.0"
description = "FastAPI gateway in front of the PrivGuard engine: JWT auth, query, budget and audit endpoints."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privguard_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Each needs a migration, not a version bump (see IMPLEMENTATION_PLAN.md, "Held back").
      # monaco-editor 0.53+ moved the ESM paths the SQL console imports.
      - dependency-name: "monaco-editor"
        versions: [">=0.53.0"]
      # tailwindcss 4 replaces the PostCSS plugin, the @tailwind directives and the config model.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # typescript is pinned exactly (7.x ships ~20 platform binaries as optional dependencies);
      # bump it deliberately after checking the release.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

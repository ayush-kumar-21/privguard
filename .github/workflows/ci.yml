name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- oracle
  # The Python DP reference implementation. Stdlib-only and database-free, so
  # it needs no services and finishes in seconds — which is why it runs as its
  # own job rather than tacked onto the Django one.
  oracle:
    name: DP oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Run the oracle test suite
        run: bash ./run.sh oracle

      - name: Dataset generation is reproducible
        working-directory: oracle
        # Generate twice into separate trees and compare. This is the property
        # the Rust loader depends on (SPEC.md §2.2): the CSVs are the shared
        # ground truth, so "same seed, same bytes" has to hold in CI too.
        run: |
          python -m privguard_oracle.dataset --out /tmp/ds-a --seed 42
          python -m privguard_oracle.dataset --out /tmp/ds-b --seed 42
          diff -r /tmp/ds-a /tmp/ds-b

  # --------------------------------------------------------------- gateway
  # FastAPI in front of the engine. Tested against the stub engine, so it needs
  # no database and no Rust build.
  gateway:
    name: FastAPI gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Run the gateway test suite
        run: bash ./run.sh gateway

  # ---------------------------------------------------------------- engine
  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin the toolchain
        # Matches engine/Dockerfile, so a green CI means a green local build.
        run: rustup toolchain install 1.83 --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Formatting
        working-directory: engine
        run: cargo +1.83 fmt --all --check

      - name: Clippy
        working-directory: engine
        run: cargo +1.83 clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: engine
        run: cargo +1.83 test --workspace

  # ------------------------------------------------ legacy Django backend
  # Retired in Phase 5.5 once the engine passes the oracle
  # (see IMPLEMENTATION_PLAN.md).
  test:
    name: Django backend (legacy)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safehealth
          POSTGRES_USER: privguard
          POSTGRES_PASSWORD: privguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privguard -d safehealth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://privguard:privguard@localhost:5432/safehealth
      SECRET_KEY: ci-test-key
      PRIVGUARD_SERVER_SECRET: ci-noise-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches backend/Dockerfile (python:3.12-slim) and the local venv.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Seed demo data
        working-directory: backend
        run: python manage.py seed_demo

      - name: Verify budget integrity
        working-directory: backend
        run: python manage.py verify_budgets --strict

      - name: Run tests
        working-directory: backend
        run: pytest tests/ --tb=short

  # -------------------------------------------------------------- frontend
  # Typechecks and builds the React app. Without this job a dependency bump can
  # break `npm ci` / `vite build` while every other check stays green.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies (high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------- images
  # Proves both Dockerfiles still build (no push — see docker-publish.yml).
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t privguard-api:ci ./backend
      - name: Build UI image
        run: docker build -t privguard-ui:ci ./frontend

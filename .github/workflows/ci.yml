name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safehealth
          POSTGRES_USER: privguard
          POSTGRES_PASSWORD: privguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U privguard -d safehealth"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://privguard:privguard@localhost:5432/safehealth
      SECRET_KEY: ci-test-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Seed demo data
        working-directory: backend
        run: python manage.py seed_demo --no-input 2>/dev/null || true

      - name: Verify budget integrity
        working-directory: backend
        run: python manage.py verify_budgets --strict 2>/dev/null || true

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

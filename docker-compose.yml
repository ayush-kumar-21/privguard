services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safehealth
      POSTGRES_USER: privguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Not 5432: a Postgres installed on the host usually owns it. Override with DB_PORT in .env.
      - "127.0.0.1:${DB_PORT:-55000}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privguard -d safehealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    volumes:
      - ./IMPLEMENTATION_PLAN.md:/app/IMPLEMENTATION_PLAN.md:ro
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (copy .env.example)}
      PRIVGUARD_SERVER_SECRET: ${PRIVGUARD_SERVER_SECRET:?set PRIVGUARD_SERVER_SECRET in .env (copy .env.example)}
      PRIVGUARD_MONITOR_KEY: ${PRIVGUARD_MONITOR_KEY:-}
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://privguard:${POSTGRES_PASSWORD}@db:5432/safehealth
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # migrate must succeed; seeding and stat refresh are best-effort (wrapped so a
    # failure is logged but does not stop the server) — and their errors are left
    # on stderr so `docker compose logs api` shows them.
    entrypoint: |
      sh -c "python manage.py migrate --noinput &&
             { python manage.py audit_separation_of_duty || echo 'WARNING: separation-of-duty conflicts (see above)'; } &&
             { python manage.py seed_demo || echo 'seed_demo failed (continuing)'; } &&
             { python manage.py seed_activity || echo 'seed_activity failed (continuing)'; } &&
             { python manage.py refresh_catalog_stats || echo 'refresh_catalog_stats failed (continuing)'; } &&
             gunicorn privguard.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 60"

  ui:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_ACCOUNTS: "true"   # the local demo shows the demo accounts; hosted builds do not
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  pgdata:

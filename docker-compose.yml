services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safehealth
      POSTGRES_USER: privguard
      POSTGRES_PASSWORD: privguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privguard -d safehealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-insecure-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://privguard:privguard@db:5432/safehealth
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    entrypoint: |
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo --no-input 2>/dev/null || true &&
             python manage.py refresh_catalog_stats 2>/dev/null || true &&
             python manage.py runserver 0.0.0.0:8000"

  ui:
    build: ./frontend
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  pgdata:
